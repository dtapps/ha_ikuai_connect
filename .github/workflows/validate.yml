name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  hassfest:
    name: Hassfest 结构合规校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: Hassfest 校验（manifest / 翻译 / 配置流一致性）
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS 合规校验
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  pytest:
    name: Pytest 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          # 与本地开发一致，且贴近 HA 2026.6 运行时（HA 2026.x 已采用 3.14）
          python-version: "3.14"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: 运行 pytest
        run: pytest -qq
