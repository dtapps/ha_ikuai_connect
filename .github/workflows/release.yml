name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.2.3，可带前缀 v）"
        required: true
        type: string

permissions:
  contents: write

# 同一分支的多次触发取消旧的运行，避免排队浪费。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          # 与本地开发一致，且贴近 HA 2026.6 运行时（HA 2026.x 已采用 3.14）
          python-version: "3.14"

      - name: 动态写入指定版本号到 manifest
        id: bump
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="${VERSION_INPUT#[vV]}"
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式不正确：'$VERSION'，应形如 1.2.3"
            exit 1
          fi
          python - "$VERSION" <<'PY'
          import json
          import sys

          path = "custom_components/ikuai_connect/manifest.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = sys.argv[1]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"manifest version -> {data['version']}")
          PY
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 生成变更日志（上一版 → 本版）
        id: changelog
        run: |
          NEW_TAG="v${{ steps.bump.outputs.new_version }}"
          # 上一个已存在的版本 tag（排除本次要建的 tag，防止重跑时范围为空）
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -vx "$NEW_TAG" | head -n 1 || true)
          REPO_URL="https://github.com/${{ github.repository }}"

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            PREV_DESC="首次发布，以下为本版全部提交："
            COMPARE=""
          else
            RANGE="${PREV_TAG}..HEAD"
            PREV_DESC="自 ${PREV_TAG} 以来的全部变化："
            COMPARE="**完整对比 / Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...${NEW_TAG}"
          fi

          {
            echo "## 变更内容 / Changes"
            echo ""
            echo "${PREV_DESC}"
            echo ""
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
            echo ""
            echo "## 提交统计 / Stats"
            echo ""
            echo "- 提交数: $(git log --no-merges --oneline "$RANGE" | wc -l | tr -d ' ')"
            echo ""
            printf '%s\n' "$COMPARE"
          } > RELEASE_NOTES.md

          echo "=== RELEASE_NOTES.md ==="
          cat RELEASE_NOTES.md

      - name: 打包集成目录为发布附件
        run: |
          rm -f ikuai_connect.zip
          # 进入集成目录再打包：zip 根目录即 manifest.json 等文件本身，不再带
          # custom_components/ikuai_connect/ 前缀，与 HACS zip_release 解包目标一致。
          (cd custom_components/ikuai_connect && zip -r "$GITHUB_WORKSPACE/ikuai_connect.zip" . \
            -x "*/__pycache__/*" "__pycache__/*" "*.pyc" "*/.DS_Store" ".DS_Store")
          echo "=== 附件内容预览 ==="
          unzip -l ikuai_connect.zip | head -30

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: v${{ steps.bump.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: ikuai_connect.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
