# Codecov 配置文件（放在 .github/ 下，Codecov 会自动读取）
# 官方文档：https://docs.codecov.com/docs/codecov-yaml
#
# 本仓库是 Home Assistant 自定义集成（Python），覆盖率由 GitHub Actions 运行
# pytest 后通过 codecov-action 上传（需在仓库 Secrets 配置 CODECOV_TOKEN）。

coverage:
  # 覆盖率色阶范围（仅影响徽章颜色，不影响门禁）
  range: "2...80"
  round: down
  precision: 2

  status:
    # 总覆盖率状态检查。默认 informational 不阻断 PR——
    # 设为 false 可开启 Codecov 在 GitHub 侧拦截（低于 target 时失败）。
    project:
      default:
        target: auto # 与上次相比不降（棘轮）
        threshold: 2% # 允许下降 2%
        informational: true
    # 增量（patch）状态检查：本次 PR 新增代码的覆盖率
    patch:
      default:
        target: 50% # 新增代码至少 50% 覆盖
        informational: true

  ignore:
    # 测试代码不计入覆盖率分母
    - "**/tests/**"
    - "**/test_*.py"
    - "tests/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  integration:
    paths:
      - "custom_components/ikuai_connect/**"
    carryforward: true
