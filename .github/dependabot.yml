version: 2

updates:
  # Python 依赖（扫描根目录下的 pyproject.toml 与 requirements*.txt）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions 依赖（扫描 .github/workflows 下的第三方 action 版本）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
